# No [theme] block on purpose. Pinning base/background/text here forces one theme
# and REMOVES the viewer's theme control entirely -- which is what hid dark mode.
# Streamlit now follows the viewer's own setting, and app.py reads the active theme
# back through st.context.theme so the cards it paints match the chrome.

[server]
headless = true

[browser]
gatherUsageStats = false
